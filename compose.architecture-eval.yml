name: series76-architecture-eval
services:
  db:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    ports:
      - "127.0.0.1:5543:5432"
    environment:
      POSTGRES_DB: series76_architecture
      POSTGRES_USER: architecture
      POSTGRES_PASSWORD: ${ARCH_EVAL_DB_PASSWORD:?Use the experiment CLI setup command}
    volumes:
      - architecture_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architecture -d series76_architecture"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  architecture_data:
