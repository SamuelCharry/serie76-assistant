services:
  db:
    image: pgvector/pgvector:pg17-trixie@sha256:01215e09bd4bd582d20230e025b6c971deeeffee49ceef1aae167e839cb62a7e
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-series76}
      POSTGRES_USER: ${POSTGRES_USER:-series76}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      target: backend
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-series76}
      PGUSER: ${POSTGRES_USER:-series76}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a local password}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-}
      # Optional transient-error fallback, same endpoint/key; each attempt counts toward the local cap.
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-}
      DEMO_USERS_JSON: ${DEMO_USERS_JSON:-}
      OPENROUTER_REQUIRE_PARAMETERS: ${OPENROUTER_REQUIRE_PARAMETERS:-true}
      AGENT_MAX_CALLS_PER_HOUR: ${AGENT_MAX_CALLS_PER_HOUR:-120}
      DEV_DEBUG: ${DEV_DEBUG:-false}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_EXCLUDE_SOURCES: ${EMBEDDING_EXCLUDE_SOURCES:-}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-2048}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-low}
      AGENT_TOOL_CHOICE: ${AGENT_TOOL_CHOICE:-required}
      AGENT_TIMEOUT_S: ${AGENT_TIMEOUT_S:-45}
      AGENT_TURN_DEADLINE_S: ${AGENT_TURN_DEADLINE_S:-60}
      AGENT_RETRY_MIN_REMAINING_S: ${AGENT_RETRY_MIN_REMAINING_S:-10}
      AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-}
      # Opt-in LangSmith tracing: sends prompts, user text and catalogue rows to LangSmith.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-serie76-assistant}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/extracted:/app/data/extracted:ro
      - ./data/raw:/app/data/raw:ro
volumes:
  postgres_data:
