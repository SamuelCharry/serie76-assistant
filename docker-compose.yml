services:
  db:
    image: postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-series76}
      POSTGRES_USER: ${POSTGRES_USER:-series76}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      target: backend
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-series76}
      PGUSER: ${POSTGRES_USER:-series76}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a local password}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-}
      DEV_DEBUG: ${DEV_DEBUG:-false}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-2048}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-low}
      AGENT_TOOL_CHOICE: ${AGENT_TOOL_CHOICE:-required}
      AGENT_TIMEOUT_S: ${AGENT_TIMEOUT_S:-45}
      AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-}
      # Opt-in LangSmith tracing: sends prompts, user text and catalogue rows to LangSmith.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-serie76-assistant}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/extracted:/app/data/extracted:ro
      - ./data/raw:/app/data/raw:ro
  ocr:
    profiles: ["ocr"]
    build:
      context: .
      target: ocr
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/ocr:/app/data/ocr
    command: ["--page", "1", "--psm", "3", "--out", "data/ocr/page1-psm3"]
volumes:
  postgres_data:
